name: Quality gates

on:
  pull_request:
  push:
    branches:
      - main
      - codex/**

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Next.js route type generation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  verify:
    name: Tests, build, launch check, and audit
    runs-on: ubuntu-latest
    env:
      ANDOR_DISABLE_EXTERNAL_ENRICHMENT: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run check:launch
      - run: npm audit --omit=dev
